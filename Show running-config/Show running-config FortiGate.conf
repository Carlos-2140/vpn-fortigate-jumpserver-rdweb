config system global
    set alias "FortiGate-VM64-KVM"
    set hostname "FortiGate-VM64-KVM"
    set timezone 04
end

config system interface
    edit "port1"
        set vdom "root"
        set ip 198.51.100.2 255.255.255.252
        set allowaccess ping https http
        set type physical
        set alias "WAN-ISP"
        set role wan
    next
    edit "port2"
        set vdom "root"
        set ip 10.21.40.129 255.255.255.248
        set allowaccess ping
        set type physical
        set alias "WEB-LAN"
        set role lan
    next
    edit "port3"
        set vdom "root"
        set ip 10.21.40.137 255.255.255.248
        set allowaccess ping
        set type physical
        set alias "JUMP-LAN"
        set role lan
    next
    edit "VPN-RA-01"
        set vdom "root"
        set type tunnel
        set interface "port1"
    next
end

config firewall address
    edit "WEB-SERVER"
        set associated-interface "port2"
        set subnet 10.21.40.130 255.255.255.255
    next
    edit "JUMP-SERVER"
        set associated-interface "port3"
        set subnet 10.21.40.138 255.255.255.255
    next
    edit "VPN-RA-01_range"
        set type iprange
        set comment "VPN: VPN-RA-01 (Created by VPN wizard)"
        set start-ip 10.21.41.1
        set end-ip 10.21.41.6
    next
end

config firewall addrgrp
    edit "VPN-RA-01_split"
        set member "JUMP-SERVER"
        set comment "VPN: VPN-RA-01 (Created by VPN wizard)"
    next
end

config user local
    edit "vpnuser"
        set type password
        set passwd "<REDACTED>"
    next
end

config user group
    edit "VPN-USERS"
        set member "vpnuser"
    next
end

config firewall service custom
    edit "RDS-WEBSOCKET-3392"
        set tcp-portrange 3392
    next
end

config firewall service group
    edit "JUMP-TO-WEB-SERVICES"
        set member "HTTPS" "RDP" "SSH"
    next
end

config vpn ipsec phase1-interface
    edit "VPN-RA-01"
        set type dynamic
        set interface "port1"
        set mode aggressive
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal des-md5 des-sha1
        set comments "VPN: VPN-RA-01 (Created by VPN wizard)"
        set dhgrp 14
        set xauthtype auto
        set authusrgrp "VPN-USERS"
        set ipv4-start-ip 10.21.41.1
        set ipv4-end-ip 10.21.41.6
        set ipv4-netmask 255.255.255.248
        set dns-mode auto
        set ipv4-split-include "VPN-RA-01_split"
        set psksecret "<REDACTED>"
    next
end

config vpn ipsec phase2-interface
    edit "VPN-RA-01"
        set phase1name "VPN-RA-01"
        set proposal des-md5 des-sha1
        set dhgrp 14
        set comments "VPN: VPN-RA-01 (Created by VPN wizard)"
    next
end

config router static
    edit 1
        set gateway 198.51.100.1
        set device "port1"
    next
end

config firewall policy
    edit 1
        set name "ALLOW-JUMP-TO-WEB"
        set srcintf "port3"
        set dstintf "port2"
        set action accept
        set srcaddr "JUMP-SERVER"
        set dstaddr "WEB-SERVER"
        set schedule "always"
        set service "JUMP-TO-WEB-SERVICES"
        set logtraffic all
    next
    edit 2
        set name "DENY-JUMP-TO-WEB-OTHER"
        set srcintf "port3"
        set dstintf "port2"
        set srcaddr "JUMP-SERVER"
        set dstaddr "WEB-SERVER"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 3
        set name "vpn_VPN-RA-01_remote_0"
        set srcintf "VPN-RA-01"
        set dstintf "port3"
        set action accept
        set srcaddr "VPN-RA-01_range"
        set dstaddr "JUMP-SERVER"
        set schedule "always"
        set service "HTTPS" "PING" "RDP" "RDS-WEBSOCKET-3392"
        set logtraffic all
        set comments "VPN: VPN-RA-01 (Created by VPN wizard)"
    next
end

